name: Backend CI and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java tests and packages
        run: |
          mvn -B -ntp -f services/api/pom.xml test package
          mvn -B -ntp -f services/sim/pom.xml package
      - name: Isolated integration checks
        run: python3 scripts/smoke.py
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy checked release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.KAMPUS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.KAMPUS_KNOWN_HOSTS }}
        run: ./scripts/ci-deploy.sh
