server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.local/kampus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.error.include-message=never
kampus.sim-url=${SIM_URL:http://localhost:8081}
kampus.sim-key=${SIM_KEY:kampus-local-simulator-key}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-http-form-post-size=128KB
server.tomcat.max-swallow-size=128KB
server.tomcat.threads.max=80
spring.datasource.hikari.maximum-pool-size=10
kampus.cors-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*}
kampus.deployed=${DEPLOYED:false}
kampus.demo-pin=${DEMO_PIN:123456}
kampus.admin-pin=${ADMIN_PIN:123456}
kampus.kyc-media-key=${KYC_MEDIA_KEY:}
